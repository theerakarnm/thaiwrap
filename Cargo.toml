[workspace]
# Resolver 3 prefers dependency versions compatible with rust-version (MSRV job).
resolver = "3"
members = ["crates/thaiwrap-core", "crates/thaiwrap-node", "crates/bench-compare"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT AND Unicode-3.0 AND Apache-2.0"
repository = "https://github.com/theerakarnm/thaiwrap"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
