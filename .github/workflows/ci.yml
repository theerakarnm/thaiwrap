name: CI
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: '0 3 * * 1' }] # weekly: catch new Bun and Node releases
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --release
      - run: cargo bench --workspace --no-run --locked
      - run: '! grep -rnw "unsafe" crates/*/src'
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal && cargo +1.88 check --workspace --locked
  build-test:
    uses: ./.github/workflows/build-test.yml
  parity:
    # Pinned to the exact Node release whose ICU recorded parity-known-diffs.json,
    # so the weekly run cannot go red on an ICU update. Bumping the pin is a reviewed PR
    # that re-baselines. Not part of the release path.
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'bindings-x86_64-unknown-linux-gnu' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: js-binding }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24.22.2' }
      - run: node --test __test__/parity.node.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun __test__/parity.mjs
