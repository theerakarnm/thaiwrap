name: CI
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: '0 3 * * 1' }] # weekly: catch new Bun and Node releases
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --release
      - run: cargo bench --workspace --no-run --locked
      - run: '! grep -rnw "unsafe" crates/*/src'
      - uses: EmbarkStudios/cargo-deny-action@v2
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.88 --profile minimal && cargo +1.88 check --workspace --locked
  build-test:
    uses: ./.github/workflows/build-test.yml
  parity:
    # Pinned to the exact Node release whose ICU recorded parity-known-diffs.json,
    # so the weekly run cannot go red on an ICU update. Bumping the pin is a reviewed PR
    # that re-baselines. Not part of the release path.
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: 'bindings-x86_64-unknown-linux-gnu' }
      - uses: actions/download-artifact@v8
        with: { name: js-binding }
      - uses: actions/setup-node@v7
        with: { node-version: '24.22.2' }
      - run: node --test __test__/parity.node.mjs
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun __test__/parity.mjs
