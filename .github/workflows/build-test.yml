name: build-test
on: { workflow_call: {} }
permissions: { contents: read }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, flags: '' }
          - { target: x86_64-apple-darwin, os: macos-15, flags: '' }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, flags: '--use-napi-cross' }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04, flags: '--use-napi-cross' }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, flags: '-x' }
          - { target: x86_64-pc-windows-msvc, os: windows-2025, flags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 } # pinned: this job builds what ships; the test jobs keep latest
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: contains(matrix.flags, '-x')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        # Without a version, setup-zig installs the latest release, which was 0.17.0 on 2026-10-31
        # (https://ziglang.org/download/index.json). zig 0.17.0 with cargo-zigbuild 0.24.0 built the musl
        # target locally on 2026-10-31. cargo-zigbuild does not pin zig, so bump both deliberately.
        with: { version: 0.17.0 }
      - if: contains(matrix.flags, '-x')
        run: cargo install cargo-zigbuild --version 0.24.0 --locked
      - run: bun install --frozen-lockfile
      # The napi build runs cargo without --locked, so a stale Cargo.lock would be updated silently in the shipped binaries.
      - run: cargo metadata --locked --format-version 1 > /dev/null
        shell: bash
      # npm (preinstalled on every runner) strips the `--` before passing the flags to napi.
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.flags }}
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: git diff --exit-code binding.d.ts
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: js-binding, path: binding.js, if-no-files-found: error }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: 'bindings-${{ matrix.target }}', path: 'thaiwrap.*.node', if-no-files-found: error }

  test-host:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
        node: ['22', '24']
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'bindings-${{ matrix.platform.target }}' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: js-binding }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.node == '24'
        with: { bun-version: latest }
      - run: node --test __test__/node-runner.mjs
      - run: node __test__/e2e/smoke.mjs
      - if: matrix.node == '24'
        run: bun test && bun __test__/e2e/smoke.mjs

  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, node: 'node:22-bookworm-slim', node24: 'node:24-bookworm-slim', bun: 'oven/bun:slim' }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, node: 'node:22-bookworm-slim', node24: 'node:24-bookworm-slim', bun: 'oven/bun:slim' }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, node: 'node:22-alpine', node24: 'node:24-alpine', bun: 'oven/bun:alpine' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: 'bindings-${{ matrix.target }}' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: js-binding }
      - run: |
          for image in ${{ matrix.node }} ${{ matrix.node24 }}; do
            docker run --rm -v "$PWD":/w -w /w "$image" sh -c 'node --test __test__/node-runner.mjs && node __test__/e2e/smoke.mjs'
          done
          docker run --rm -v "$PWD":/w -w /w ${{ matrix.bun }} sh -c 'bun test && bun __test__/e2e/smoke.mjs'

  unsupported:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: js-binding }
      - run: docker run --rm -v "$PWD":/w -w /w node:22-alpine node __test__/e2e/unsupported.mjs

  package-contents:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: js-binding }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json","utf8"))[0].files.map(f => f.path).sort()
            const expected = ["LICENSE","LICENSE-UNICODE","README.md","binding.d.ts","binding.js","index.d.ts","index.js","package.json","platform.js"]
            if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error(files); process.exit(1) }'
