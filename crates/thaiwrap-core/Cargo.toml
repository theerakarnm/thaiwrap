[package]
name = "thaiwrap"
description = "Thai-aware line wrapping at word boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["thai", "line-breaking", "word-wrap", "text", "unicode"]
categories = ["text-processing", "internationalization"]
include = ["src/**", "data/icu-thai.postcard", "Cargo.toml", "README.md", "LICENSE", "LICENSE-UNICODE"]

[dependencies]
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["serde"] }
icu_provider_blob = "=2.4.0"
# sync makes the data cart an Arc, so the cached segmenters are Send + Sync even when the
# compiled_data dev-dependency turns on icu_provider/alloc (D20).
icu_provider = { version = "=2.4.0", default-features = false, features = ["sync"] }

[dev-dependencies]
proptest = "=1.12.0"
criterion = "=0.8.2"
# Compiled ICU4X data, only as a test oracle for the embedded blob (and for compare_segmenters).
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }

[[bench]]
name = "wrap"
path = "../../benches/wrap.rs"
harness = false
