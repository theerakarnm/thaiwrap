[package]
name = "thaiwrap-core"
description = "Thai-aware line wrapping at word boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
include = ["src/**", "Cargo.toml"]

[dependencies]
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
proptest = "=1.12.0"
criterion = "=0.8.2"

[[bench]]
name = "wrap"
path = "../../benches/wrap.rs"
harness = false
