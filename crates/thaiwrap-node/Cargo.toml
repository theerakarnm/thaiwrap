[package]
name = "thaiwrap-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
thaiwrap-core = { path = "../thaiwrap-core" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3.7"

[build-dependencies]
napi-build = "2"
